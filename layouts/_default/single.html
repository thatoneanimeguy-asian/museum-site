{{ define "main" }}

<!-- 1. The Cog Button (Added safely at the top of the main block) -->
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
  <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
</button>

<!-- Your Original Banner Section (Untouched) -->
<section class="page-banner">
    <div class="container">
        <h1>{{ .Title }}</h1>
        {{ with .Params.description }}
        <p class="intro">{{ . }}</p>
        {{ end }}
    </div>
</section>

<!-- Your Original Content Section (Untouched) -->
<section class="section page-content">
    <div class="container">
        <div class="content-body">
            {{ .Content }}
        </div>
    </div>
</section>

<!-- 2. The JavaScript Script (Added safely at the very end of the block) -->
<script>
    // Wait until the entire webpage is loaded before looking for the button
    document.addEventListener('DOMContentLoaded', () => {
        const toggleButton = document.getElementById('themeToggle');
        
        // Safety check to ensure the script finds the button
        if (!toggleButton) {
            console.error("Theme toggle button was not found in the HTML!");
            return;
        }

        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) {
          document.documentElement.setAttribute('data-theme', currentTheme);
        }

        toggleButton.addEventListener('click', () => {
          let theme = document.documentElement.getAttribute('data-theme');
          if (theme === 'dark') {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
          }
        });
    });
</script>

{{ end }}
