{{ define "main" }}
          
<section class="page-banner">
  <div class="container">
    <h1>Calendar</h1>
    
    <p class="intro">See upcoming event dates, exhibition openings, and community programs.</p>
    
  </div>
</section>
<section class="section page-content">
  <div class="container">
    <div class="content-body">
<div class="slider-container">
  <!-- The Images (Change the sources to your actual image paths) -->
  <div class="slide active"><img src="{{ "images/may.jpg" | relURL }}" alt="First Image"></div>
  <div class="slide"><img src="{{ "images/june.jpg" | relURL }}" alt="Second Image"></div>
  <div class="slide"><img src="{{ "images/july.jpg" | relURL }}" alt="Third Image"></div>
  <div class="slide"><img src="{{ "images/august.jpg" | relURL }}" alt="fourth Image"></div>

  <!-- Navigation Arrows -->
  <button class="arrow prev-arrow" onclick="changeSlide(-1)">&#10094;</button>
  <button class="arrow next-arrow" onclick="changeSlide(1)">&#10095;</button>
</div>


    </div>
  </div>
</section>

        
{{ end }}
