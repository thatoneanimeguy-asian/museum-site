{{ define "main" }}

<section class="page-banner">
  <div class="container">
    <h1>Calendar</h1>
    
    <p class="intro">See upcoming event dates, exhibition openings, and community programs.</p>
    
  </div>
</section>
<section class="section page-content">
  <div class="container">
    <div class="content-body">
      <p>Our calendar highlights exhibition openings, special programs, and public events. Check back often for new updates and seasonal activities.</p>
      <div class="calendar-widget">
        <div class="calendar-header">
          <div>
            <h2><span class="calendar-month"></span> <span class="calendar-year"></span></h2>
          </div>
          <div class="calendar-controls">
            <button type="button" class="calendar-prev">Previous</button>
            <button type="button" class="calendar-next">Next</button>
          </div>
        </div>
        <table class="calendar-table" aria-label="Calendar">
          <thead>
            <tr>
              <th>Sun</th>
              <th>Mon</th>
              <th>Tue</th>
              <th>Wed</th>
              <th>Thu</th>
              <th>Fri</th>
              <th>Sat</th>
            </tr>
          </thead>
          <tbody class="calendar-days"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>
<script src="{{ "js/calender.js" | relURL }}" defer></script>

{{ end }}
